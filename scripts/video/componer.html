<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Composición · Nada, abu. Me recibí.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..112,400..800&family=Caveat:wght@500;700&display=block"
    />
    <style>
      /* El lienzo: 1080×1920. Nada se anima con CSS: `render(t)` calcula cada
         cuadro a partir del tiempo, así el mismo instante da siempre la misma
         imagen. Las capas, de atrás para adelante:
           papel → celular (canvas) → velos → fecha y frase → burbujas → número
           → cierre (la libreta) → papel picado (canvas) → destello */
      :root {
        --papel: #f6f5f1;
        --tinta: #151b33;
        --azul: #24388a;
        --resalta: #ffe45c;
        --linea: #e3e1da;
        --suave: #5b6173;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--papel);
        font-family: 'Archivo', sans-serif;
        color: var(--tinta);
        -webkit-font-smoothing: antialiased;
      }
      #lienzo {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #lienzo > * {
        position: absolute;
      }
      canvas {
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      /* Cuando la cámara se acerca, la parte de arriba de la app se funde con el
         papel: así la fecha y la frase quedan sobre limpio, sin pisar nada. */
      #velo {
        inset: 0 0 auto 0;
        height: 460px;
        background: linear-gradient(var(--papel) 0, var(--papel) 318px, rgba(246, 245, 241, 0) 446px);
      }
      /* Lo mismo abajo, cuando hay mensajes: se apoyan sobre papel limpio en vez
         de pelearse con la app que tienen detrás. */
      #velo-abajo {
        inset: auto 0 0 0;
        height: 930px;
        background: linear-gradient(rgba(246, 245, 241, 0) 0, rgba(246, 245, 241, 0.96) 150px, var(--papel) 200px);
      }
      #destello {
        inset: 0;
        background: #fff;
      }

      /* ── Cabecera: la fecha en una ficha, y a veces una frase resaltada ── */
      #fecha,
      #titulo {
        left: 0;
        width: 1080px;
        text-align: center;
        font-stretch: 108%;
        white-space: nowrap;
      }
      #fecha span {
        display: inline-block;
        padding: 9px 26px 11px;
        border-radius: 14px;
        background: #fff;
        border: 2px solid var(--linea);
        box-shadow: 0 6px 16px rgba(21, 27, 51, 0.12);
        font-size: 40px;
        line-height: 48px;
        font-weight: 700;
        color: var(--azul);
      }
      #titulo {
        top: 322px;
      }
      #titulo span,
      #c-url b {
        display: inline-block;
        border-radius: 10px;
        /* El resaltador se "pasa" de izquierda a derecha: el ancho lo pone render(). */
        background: linear-gradient(var(--resalta), var(--resalta)) no-repeat left center;
        font-weight: 800;
      }
      #titulo span {
        padding: 4px 22px 8px;
        font-size: 56px;
        line-height: 64px;
        letter-spacing: -0.02em;
      }

      /* ── Burbujas: genéricas, con los colores de la app ── */
      #pares {
        inset: 0;
      }
      .par {
        position: absolute;
        left: 0;
        width: 1080px;
        bottom: 430px; /* el borde de abajo queda en y = 1490 */
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .hueco {
        position: relative;
        display: flex;
      }
      .hueco.abu {
        justify-content: flex-start;
        margin-left: 130px;
      }
      .hueco.yo {
        justify-content: flex-end;
        margin-right: 130px; /* borde derecho en x = 950 */
      }
      .burbuja {
        max-width: 820px;
        padding: 17px 30px 20px;
        border-radius: 28px;
        font-size: 44px;
        line-height: 1.18;
        font-weight: 600;
        letter-spacing: -0.01em;
        text-wrap: balance;
        box-shadow: 0 10px 28px rgba(21, 27, 51, 0.2);
      }
      .abu > .burbuja,
      .abu > .puntos {
        background: #fff;
        border: 2px solid var(--linea);
        border-bottom-left-radius: 8px;
      }
      .abu > .burbuja small {
        display: block;
        margin-bottom: 2px;
        font-size: 25px;
        line-height: 30px;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--azul);
      }
      .yo > .burbuja {
        background: var(--azul);
        color: #fff;
        border-bottom-right-radius: 8px;
      }
      /* "Escribiendo…": solo en el final, donde la espera importa. */
      .puntos {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        gap: 11px;
        padding: 30px 30px;
        border-radius: 28px;
        color: var(--suave);
        box-shadow: 0 10px 28px rgba(21, 27, 51, 0.2);
      }
      .puntos i {
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: currentColor;
      }

      /* ── La cuenta regresiva: el número, grande ── */
      #numero {
        left: 0;
        width: 1080px;
        bottom: 430px;
        display: flex;
        justify-content: center;
      }
      #numero .tarjeta {
        min-width: 330px;
        padding: 26px 40px 30px;
        border-radius: 34px;
        background: #fff;
        border: 2px solid var(--linea);
        box-shadow: 0 10px 30px rgba(21, 27, 51, 0.22);
        text-align: center;
      }
      #numero b {
        display: inline-block;
        min-width: 250px;
        padding: 0 26px;
        border-radius: 12px;
        background: var(--resalta);
        font-size: 196px;
        line-height: 204px;
        font-weight: 800;
        font-stretch: 108%;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }

      /* ── El final ── */
      #cierre {
        inset: 0;
        background: var(--papel);
      }
      #cierre > * {
        position: absolute;
      }
      #c-chat {
        left: 0;
        width: 1080px;
        top: 540px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #c-chat .burbuja {
        font-size: 50px;
        max-width: 700px;
        padding: 20px 32px 24px;
        box-shadow: 0 4px 14px rgba(21, 27, 51, 0.1);
      }
      #c-chat .hueco.foto {
        height: 346px; /* el lugar de la foto */
      }
      #c-marco {
        left: 130px;
        top: 822px;
        width: 266px;
        height: 346px;
        border-radius: 26px 26px 26px 8px;
        background: #fff;
        border: 2px solid var(--linea);
        box-shadow: 0 4px 14px rgba(21, 27, 51, 0.1);
      }

      /* La libreta de la abuela. Papel rayado, birome azul, letra de ella. */
      #libreta {
        left: 0;
        top: 0;
        width: 800px;
        height: 1060px;
        transform-origin: 0 0;
        border-radius: 8px;
        background:
          linear-gradient(90deg, transparent 138px, rgba(217, 99, 15, 0.35) 138px, rgba(217, 99, 15, 0.35) 141px, transparent 141px),
          repeating-linear-gradient(transparent 0, transparent 105px, #c7d3ee 105px, #c7d3ee 108px),
          #fffdf5;
        background-position: 0 0, 0 108px, 0 0;
        box-shadow: 0 14px 40px rgba(21, 27, 51, 0.22);
        font-family: 'Caveat', cursive;
        color: var(--azul);
      }
      #libreta .cinta {
        position: absolute;
        left: 310px;
        top: -26px;
        width: 180px;
        height: 56px;
        background: rgba(255, 228, 92, 0.78);
        transform: rotate(-3deg);
      }
      #libreta h3 {
        position: absolute;
        left: 170px;
        top: 108px;
        margin: 0;
        font-size: 78px;
        line-height: 100px;
        font-weight: 700;
        border-bottom: 5px solid var(--azul);
        border-radius: 0 0 40% 60% / 0 0 8px 6px;
      }
      #libreta .renglon {
        position: absolute;
        left: 170px;
        right: 30px;
        height: 108px;
        display: flex;
        align-items: flex-end;
        gap: 34px;
        padding-bottom: 2px;
      }
      #libreta .cuando {
        width: 200px;
        font-size: 56px;
        line-height: 80px;
        font-weight: 500;
        opacity: 0.8;
      }
      #libreta .valor {
        position: relative;
        font-size: 92px;
        line-height: 92px;
        font-weight: 700;
      }
      #libreta .valor.texto {
        font-size: 70px;
        line-height: 84px;
      }
      /* Tachado a mano: una raya que no es del todo recta. */
      #libreta .valor.tachado::after {
        content: '';
        position: absolute;
        left: -16px;
        right: -18px;
        top: 50%;
        height: 6px;
        border-radius: 6px;
        background: var(--azul);
        transform: rotate(-7deg);
      }
      #libreta .extra {
        font-size: 54px;
        line-height: 74px;
        font-weight: 700;
        transform: rotate(-4deg);
      }
      #libreta .valor.cero {
        font-size: 120px;
        line-height: 100px;
        padding: 0 16px;
      }
      #libreta svg {
        position: absolute;
        left: -34px;
        top: -24px;
        width: 150px;
        height: 150px;
        overflow: visible;
      }
      #libreta .firma {
        position: absolute;
        right: 70px;
        bottom: 64px;
        font-size: 110px;
        line-height: 110px;
        font-weight: 700;
        transform: rotate(-3deg);
      }

      #c-tarjeta {
        left: 0;
        width: 1080px;
        top: 832px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #c-llamado {
        display: flex;
        align-items: center;
        gap: 22px;
        font-size: 62px;
        line-height: 76px;
        font-weight: 800;
        font-stretch: 108%;
        letter-spacing: -0.02em;
      }
      #c-url {
        margin-top: 26px;
      }
      #c-url b {
        padding: 6px 26px 10px;
        border-radius: 12px;
        font-size: 78px;
        line-height: 90px;
        font-stretch: 108%;
        letter-spacing: -0.025em;
      }
      #c-chico {
        margin-top: 40px;
        width: 780px;
        text-align: center;
        font-size: 31px;
        line-height: 44px;
        font-weight: 500;
        color: var(--suave);
        text-wrap: balance;
      }
    </style>
  </head>
  <body>
    <div id="lienzo">
      <canvas id="escena" width="1080" height="1920"></canvas>
      <div id="velo"></div>
      <div id="velo-abajo"></div>
      <div id="fecha"><span></span></div>
      <div id="titulo"><span></span></div>
      <div id="pares"></div>
      <div id="numero"><div class="tarjeta"><b></b></div></div>
      <div id="cierre">
        <div id="c-chat"></div>
        <div id="c-marco"></div>
        <div id="libreta">
          <div class="cinta"></div>
          <h3></h3>
          <div class="firma"></div>
        </div>
        <div id="c-tarjeta">
          <div id="c-llamado">
            <svg viewBox="0 0 100 100" width="84" height="84" aria-hidden="true">
              <rect x="4" y="4" width="92" height="92" rx="22" fill="#ffe45c" />
              <path id="c-trazo" transform="translate(21.95 64.73) scale(0.083)" fill="#151b33" />
            </svg>
            <span></span>
          </div>
          <div id="c-url"><b></b></div>
          <div id="c-chico"></div>
        </div>
      </div>
      <canvas id="confeti" width="1080" height="1920"></canvas>
      <div id="destello"></div>
    </div>

    <script>
      const $ = (s) => document.querySelector(s)
      const COLOR = { aprobada: '#1d8a57', final: '#d9630f', cursando: '#7c4dc9' }
      const PAPELITOS = ['#1d8a57', '#ffe45c', '#24388a', '#d9630f', '#7c4dc9']
      // La libreta, chica (como foto en el chat), abierta (protagonista) y arriba
      // (cuando deja lugar a la invitación): { x, y, escala, giro en grados }.
      const LIBRETA = {
        foto: { x: 143, y: 836, e: 0.3, g: -2 },
        abierta: { x: 86, y: 290, e: 1.03, g: -1.5 },
        arriba: { x: 310, y: 262, e: 0.5, g: -2.5 },
      }
      let G = null
      const imgs = new Map()
      const globos = [] // todas las burbujas (las de la app y las del final)
      let papelitos = []

      // ── Curvas ──
      const clamp = (x) => Math.max(0, Math.min(1, x))
      const lerp = (a, b, p) => a + (b - a) * p
      const CURVA = {
        lineal: (p) => p,
        sale: (p) => 1 - Math.pow(1 - p, 3),
        suave: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
      }
      const sale = (x) => CURVA.sale(clamp(x))
      const suave = (x) => CURVA.suave(clamp(x))
      const r = (x) => Math.round(x * 1000) / 1000
      /** Valor de una pista [[t, v], …] en el instante t, interpolando en línea recta. */
      function pista(claves, t) {
        let v = claves[0][1]
        for (let i = 1; i < claves.length; i++) {
          const [t0, v0] = claves[i - 1]
          const [t1, v1] = claves[i]
          if (t >= t1) v = v1
          else if (t > t0) return lerp(v0, v1, (t - t0) / (t1 - t0))
        }
        return v
      }
      /** Azar repetible: la misma semilla da siempre los mismos papelitos. */
      function azar(semilla) {
        let a = semilla
        return () => {
          a = (a + 0x6d2b79f5) | 0
          let x = Math.imul(a ^ (a >>> 15), 1 | a)
          x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x
          return ((x ^ (x >>> 14)) >>> 0) / 4294967296
        }
      }

      /** Entrada y salida de algo que vive entre t0 y t1: opacidad y un corrimiento corto. */
      function vida(t, t0, t1, entra = 0.26, seVa = 0.18, sube = 22) {
        if (t < t0 || t >= t1) return { o: 0, y: 0 }
        const a = sale((t - t0) / entra)
        const b = clamp((t1 - t) / seVa)
        return { o: r(a * b), y: r((1 - a) * sube - (1 - b) * 10) }
      }
      const pon = (el, v, extra = '') => {
        el.style.opacity = v.o
        el.style.transform = `translateY(${v.y}px) ${extra}`
      }

      /** Las capturas se cargan cuando hacen falta y se sueltan después: son
       *  más de cuatrocientas y, abiertas todas juntas, no entran en memoria. */
      async function imagen(id) {
        let p = imgs.get(id)
        if (p) imgs.delete(id)
        else {
          const im = new Image()
          im.src = `${G.base}/${id}.png`
          p = im.decode().then(() => im)
        }
        imgs.set(id, p) // la más reciente, al final
        if (imgs.size > 6) imgs.delete(imgs.keys().next().value)
        return p
      }

      // ── La cámara ──
      function camara(t) {
        const K = G.camara.claves
        let i = 0
        while (i + 1 < K.length && K[i + 1].t <= t) i++
        const a = K[i]
        const b = K[i + 1]
        if (!b || b.e === 'corte') return { k: a.k, tx: a.tx, ty: a.ty }
        const p = CURVA[b.e](clamp((t - a.t) / (b.t - a.t)))
        return { k: lerp(a.k, b.k, p), tx: lerp(a.tx, b.tx, p), ty: lerp(a.ty, b.ty, p) }
      }

      // ── Burbujas ──
      function crearGlobo(contenedor, b) {
        const hueco = document.createElement('div')
        hueco.className = `hueco ${b.quien}`
        const el = document.createElement('div')
        el.className = 'burbuja'
        if (b.etiqueta) el.innerHTML = '<small>Abu</small>'
        el.appendChild(document.createTextNode(b.texto))
        hueco.appendChild(el)
        contenedor.appendChild(hueco)
        globos.push({ ...b, el })
      }
      function dibujarGlobo(b, t, firma) {
        const v = vida(t, b.t0, b.t1)
        pon(b.el, v)
        if (v.o) firma.push(b.texto, v.o, v.y)
      }

      // ── Papel picado: casilleros de colores, como los de la app. Una sola vez. ──
      function crearPapelitos() {
        const rnd = azar(1621)
        const entre = (a, b) => a + (b - a) * rnd()
        const lista = []
        for (const tanda of G.efectos.confeti)
          for (const lado of [-1, 1])
            for (let i = 0; i < 95; i++) {
              const ang = (entre(48, 84) * Math.PI) / 180
              const vel = entre(1500, 3300)
              lista.push({
                t0: tanda.t + entre(0, 0.12), x0: lado < 0 ? -30 : 1110, y0: entre(1250, 1420),
                vx: -lado * vel * Math.cos(ang), vy: -vel * Math.sin(ang),
                tau: entre(0.34, 0.5), cae: entre(260, 430), vida: 7, lado: entre(16, 30),
                color: PAPELITOS[Math.floor(rnd() * PAPELITOS.length)],
                giro0: entre(0, 6.28), giro: entre(-7, 7), vuelta0: entre(0, 6.28), vuelta: entre(3, 9),
                vaiven: entre(10, 46), vaivenF: entre(1.2, 2.6),
              })
            }
        return lista
      }
      function dibujarPapelitos(t) {
        const ctx = $('#confeti').getContext('2d')
        ctx.setTransform(1, 0, 0, 1, 0, 0)
        ctx.clearRect(0, 0, 1080, 1920)
        let vivos = 0
        for (const p of papelitos) {
          const d = t - p.t0
          if (d < 0 || d > p.vida) continue
          const e = 1 - Math.exp(-d / p.tau)
          const x = p.x0 + p.vx * p.tau * e + p.vaiven * Math.sin(p.vaivenF * d + p.giro0)
          const y = p.y0 + p.vy * p.tau * e + p.cae * (d - p.tau * e)
          if (y > 1960) continue
          vivos++
          ctx.save()
          ctx.translate(x, y)
          ctx.rotate(p.giro0 + p.giro * d)
          ctx.scale(1, Math.cos(p.vuelta0 + p.vuelta * d)) // gira en el aire: se ve de canto
          ctx.globalAlpha = clamp((p.vida - d) / 0.6)
          ctx.fillStyle = p.color
          ctx.beginPath()
          ctx.roundRect(-p.lado / 2, -p.lado / 2, p.lado, p.lado, p.lado * 0.22)
          ctx.fill()
          ctx.restore()
        }
        return vivos
      }

      /** Arma la libreta: un renglón por año, con lo que ella fue anotando. */
      function armarLibreta(L) {
        const hoja = $('#libreta')
        hoja.querySelector('h3').textContent = L.titulo
        hoja.querySelector('.firma').textContent = L.firma
        L.renglones.forEach((ren, i) => {
          const fila = document.createElement('div')
          fila.className = 'renglon'
          fila.style.top = `${216 + i * 108}px`
          const clase = ren.tachado ? 'tachado' : ren.texto ? 'texto' : ren.cero ? 'cero' : ''
          fila.innerHTML =
            `<span class="cuando">${ren.cuando}</span><span class="valor ${clase}">${ren.valor}` +
            (ren.cero
              ? '<svg viewBox="0 0 150 150"><path id="circulo" d="M112 24C74 4 22 18 12 64c-10 48 38 80 82 68 40-11 56-58 30-92C108 20 78 12 54 22" fill="none" stroke="#24388a" stroke-width="6" stroke-linecap="round"/></svg>'
              : '') +
            `</span>${ren.extra ? `<span class="extra">${ren.extra}</span>` : ''}`
          hoja.appendChild(fila)
        })
        const c = $('#circulo')
        c.style.strokeDasharray = c.getTotalLength()
      }

      async function init(guion) {
        G = guion
        const C = G.cierre
        $('#c-trazo').setAttribute('d', G.trazo)
        $('#c-llamado span').textContent = C.llamado
        $('#c-url b').textContent = C.url
        $('#c-chico').textContent = C.chico
        // Un contenedor por intercambio: cada burbuja ocupa su lugar desde el
        // principio (invisible), así las de arriba no saltan cuando llega otra.
        const pares = new Map()
        for (const b of G.burbujas) {
          if (!pares.has(b.par)) {
            const c = document.createElement('div')
            c.className = 'par'
            $('#pares').appendChild(c)
            pares.set(b.par, c)
          }
          crearGlobo(pares.get(b.par), { ...b, cont: pares.get(b.par) })
        }
        const fin = G.dur + 1
        crearGlobo($('#c-chat'), { quien: 'abu', etiqueta: true, texto: C.abu.texto, t0: C.abu.t, t1: fin })
        crearGlobo($('#c-chat'), { quien: 'yo', texto: C.yo.texto, t0: C.yo.t, t1: fin })
        // El tercer lugar del chat: primero los puntos de "escribiendo", después la foto.
        const lugar = document.createElement('div')
        lugar.className = 'hueco abu foto'
        lugar.innerHTML = '<div class="puntos" id="c-puntos"><i></i><i></i><i></i></div>'
        $('#c-chat').appendChild(lugar)
        armarLibreta(C.libreta)
        papelitos = crearPapelitos()
        for (const w of [500, 600, 700, 800]) await document.fonts.load(`${w} 40px Archivo`)
        for (const w of [500, 700]) await document.fonts.load(`${w} 40px Caveat`)
        await document.fonts.ready
      }

      /** El celular, con lo poco que pasa sobre su pantalla. */
      async function dibujarCelular(t, toma, firma) {
        const ctx = $('#escena').getContext('2d')
        const cam = camara(t)
        const s = G.escala * cam.k
        const sat = r(pista(G.efectos.saturacion, t))
        firma.push(toma, r(s), r(cam.tx), r(cam.ty), sat)
        // El velo de arriba aparece cuando el celular sube por encima de su lugar.
        $('#velo').style.opacity = r(clamp((388 - cam.ty) / 70))

        ctx.setTransform(1, 0, 0, 1, 0, 0)
        ctx.clearRect(0, 0, 1080, 1920)
        ctx.setTransform(s, 0, 0, s, cam.tx, cam.ty) // desde acá, las medidas son las del celular
        const cuerpo = () => (ctx.beginPath(), ctx.roundRect(0, 0, 390, 844, 26.5))

        ctx.save()
        ctx.shadowColor = 'rgba(21, 27, 51, 0.2)'
        ctx.shadowBlur = 30
        ctx.shadowOffsetY = 12
        ctx.fillStyle = '#f6f5f1'
        cuerpo()
        ctx.fill()
        ctx.restore()

        ctx.save()
        cuerpo()
        ctx.clip()
        ctx.imageSmoothingQuality = 'high'
        if (sat < 1) ctx.filter = `saturate(${sat})`
        ctx.drawImage(await imagen(toma), 0, 0, 390, 844)
        ctx.filter = 'none'

        // El casillero que acaba de cambiar: un anillo fino que se abre y se va.
        // Es lo único que se marca; sin él no se ve cuál de los 52 cambió.
        const mapa = G.cajas.mapaEn[toma]
        if (mapa)
          for (const p of G.pintadas) {
            const d = t - p.t
            if (d < 0 || d > 0.4) continue
            const c = G.cajas.celdas[p.cod]
            const a = d / 0.4
            const crece = 6 * sale(a)
            ctx.globalAlpha = 1 - a
            ctx.strokeStyle = COLOR[p.estado]
            ctx.lineWidth = 1.6
            ctx.beginPath()
            ctx.roundRect(mapa.x + c.x - crece, mapa.y + c.y - crece, c.w + 2 * crece, c.h + 2 * crece, 3 + crece * 0.6)
            ctx.stroke()
            firma.push(r(d))
          }
        // El toque del dedo. Dura hasta un instante después: ahí la pantalla ya cambió.
        for (const q of G.toques) {
          const d = t - (q.t - 0.14)
          if (d < 0 || d > 0.3) continue
          ctx.globalAlpha = sale(d / 0.1) * clamp((0.3 - d) / 0.1)
          ctx.beginPath()
          ctx.arc(q.x, q.y, 26, 0, 6.2832)
          ctx.fillStyle = 'rgba(36, 56, 138, 0.2)'
          ctx.fill()
          ctx.lineWidth = 1.8
          ctx.strokeStyle = 'rgba(36, 56, 138, 0.6)'
          ctx.stroke()
          firma.push(r(d))
        }
        ctx.restore()

        ctx.globalAlpha = 1
        ctx.lineWidth = 2 / s
        ctx.strokeStyle = '#e3e1da'
        cuerpo()
        ctx.stroke()
      }

      /** El final: la última pregunta, la foto, la libreta y la invitación. */
      function dibujarCierre(t, firma) {
        const C = G.cierre
        const abre = suave((t - C.abre) / 0.8) //      la foto se abre
        const sube = suave((t - C.tarjeta) / 0.8) //   y después deja lugar a la invitación
        // El chat se va cuando la foto se abre.
        $('#c-chat').style.opacity = r(1 - abre)
        // Ella escribe… y tarda.
        const escribe = t >= C.escribe && t < C.foto
        const puntos = $('#c-puntos')
        puntos.style.opacity = escribe ? r(sale((t - C.escribe) / 0.15)) : 0
        if (escribe)
          [...puntos.children].forEach((p, i) => {
            const ola = Math.max(0, Math.sin((t - C.escribe) * 8 - i * 0.9))
            p.style.opacity = r(0.35 + 0.65 * ola)
            p.style.transform = `translateY(${r(-7 * ola)}px)`
          })
        // La foto llega como una burbuja más; después se abre y ocupa la pantalla.
        const llega = vida(t, C.foto, G.dur + 1)
        $('#c-marco').style.opacity = r(llega.o * (1 - abre))
        $('#c-marco').style.transform = `translateY(${llega.y}px)`
        const a = LIBRETA.foto
        const b = LIBRETA.abierta
        const c = LIBRETA.arriba
        const mezcla = (k) => lerp(lerp(a[k], b[k], abre), c[k], sube)
        const hoja = $('#libreta')
        hoja.style.opacity = llega.o
        hoja.style.transform = `translate(${r(mezcla('x'))}px, ${r(mezcla('y') + llega.y)}px) rotate(${r(mezcla('g'))}deg) scale(${r(mezcla('e'))})`
        // El círculo alrededor del cero se dibuja; "Yo sabía." se escribe.
        const circ = $('#circulo')
        const largo = circ.getTotalLength()
        const pC = suave((t - C.circulo) / 0.7)
        circ.style.strokeDashoffset = r(largo * (1 - pC))
        circ.style.opacity = pC > 0 ? 1 : 0
        const pF = suave((t - C.firma) / 0.8)
        hoja.querySelector('.firma').style.clipPath = `inset(-20% ${r(100 - 104 * pF)}% -20% -4%)`
        // La invitación.
        const vL = vida(t, C.tarjeta + 0.35, G.dur + 1, 0.35)
        pon($('#c-llamado'), vL)
        const vU = vida(t, C.tarjeta + 0.8, G.dur + 1, 0.3)
        const trazo = r(100 * suave((t - C.tarjeta - 0.85) / 0.5))
        $('#c-url b').style.backgroundSize = `${trazo}% 100%`
        pon($('#c-url'), vU)
        const vCh = vida(t, C.tarjeta + 1.3, G.dur + 1, 0.35, 0.2, 14)
        pon($('#c-chico'), vCh)
        firma.push('c', r(abre), r(sube), escribe ? r(t) : 0, llega.o, llega.y, r(pC), r(pF), vL.o, vL.y, vU.o, vU.y, trazo, vCh.o, vCh.y)
      }

      /** Dibuja el instante `t`. Devuelve una firma: si no cambia, el cuadro es igual. */
      async function render(t) {
        const firma = []
        const C = G.cierre

        // La app: la última toma que empezó antes de t. Con el cierre encima ya no se dibuja.
        let toma = G.tomas[0].img
        for (const x of G.tomas) if (x.t <= t + 1e-6) toma = x.img
        const oC = r(clamp((t - C.t0) / 0.35))
        if (oC < 1) await dibujarCelular(t, toma, firma)

        // El fogonazo de la revelación.
        let oD = 0
        for (const d of G.efectos.destellos) if (t >= d.t && t < d.t + d.dur) oD = d.a * Math.pow(1 - (t - d.t) / d.dur, 2)
        $('#destello').style.opacity = r(oD)
        firma.push(r(oD))

        // La frase del momento: el resaltador se pasa de izquierda a derecha.
        const tit = G.titulos.find((x) => t >= x.t0 && t < x.t1)
        const vTit = tit ? vida(t, tit.t0, tit.t1, 0.2, 0.2, 10) : { o: 0, y: 0 }
        const trazo = tit ? r(100 * suave((t - tit.t0 - 0.05) / 0.42)) : 0
        if (tit) $('#titulo span').textContent = tit.texto
        if (tit) $('#titulo span').style.fontSize = tit.chico ? '46px' : '' // las frases largas, más chicas
        $('#titulo span').style.backgroundSize = `${trazo}% 100%`
        pon($('#titulo'), vTit)
        // La fecha, que le hace lugar.
        const fe = G.fechas.find((x) => t >= x.t0 && t < x.t1)
        const vFe = fe ? vida(t, fe.t0, fe.t1, 0.25, 0.14, 16) : { o: 0, y: 0 }
        if (fe) $('#fecha span').textContent = fe.texto
        const lugar = tit ? sale((t - tit.t0) / 0.3) * clamp((tit.t1 - t) / 0.2) : 0
        $('#fecha').style.top = `${r(262 - 22 * lugar)}px`
        pon($('#fecha'), vFe)
        firma.push(tit?.texto, vTit.o, vTit.y, trazo, fe?.texto, vFe.o, vFe.y, r(lugar))

        // Las burbujas, y el velo de abajo que les hace lugar: sube un instante
        // antes de que aparezcan y se va con ellas.
        let oB = 0
        for (const b of globos) {
          if (b.cont) {
            b.cont.style.display = t >= b.t0 - 0.5 && t < b.t1 + 0.1 ? 'flex' : 'none'
            oB = Math.max(oB, sale((t - (b.t0 - 0.35)) / 0.35) * clamp((b.t1 + 0.1 - t) / 0.3))
          }
          dibujarGlobo(b, t, firma)
        }
        $('#velo-abajo').style.opacity = r(oB)
        firma.push(r(oB))

        // El número de la cuenta regresiva: cambia y nada más.
        const N = G.numero
        const ini = N.puntos[0].t
        const vN = vida(t, ini, N.hasta, 0.28, 0.12)
        let valor = N.puntos[0].valor
        for (const p of N.puntos) if (p.t <= t + 1e-6) valor = p.valor
        $('#numero b').textContent = valor
        pon($('#numero'), vN)
        if (vN.o) firma.push('n', valor, vN.o, vN.y)

        // El final.
        $('#cierre').style.opacity = oC
        $('#cierre').style.display = oC ? 'block' : 'none'
        if (oC) (dibujarCierre(t, firma), firma.push(oC))

        // El papel picado de la revelación, por encima de todo.
        if (dibujarPapelitos(t)) firma.push('p', r(t))
        return firma.join('|')
      }
    </script>
